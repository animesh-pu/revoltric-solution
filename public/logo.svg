<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Revoltric Solutions logo">
  <!-- White tile -->
  <rect width="512" height="512" rx="108" fill="#FFFFFF"/>
  <defs>
    <clipPath id="cross">
      <rect x="188" y="76" width="136" height="360" rx="40"/>
      <rect x="76" y="188" width="360" height="136" rx="40"/>
    </clipPath>
  </defs>
  <!-- Cross with diagonal colour split -->
