    <polygon points="0,0 512,0 512,512" fill="#0FA3A0"/>
    <polygon points="0,0 0,512 512,512" fill="#0B1F4B"/>
  </g>
  <!-- White ECG heartbeat -->
  <path
    d="M256,92 L256,152 L234,160 L244,172 L256,176 L234,184 L206,132 L234,200 L256,208 L256,412"
    stroke="#FFFFFF"
