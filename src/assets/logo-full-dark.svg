<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" role="img" aria-label="REVOLTRIC Healthcare Solutions">
  <!-- Teal rounded square icon -->
  <rect x="0" y="0" width="72" height="72" rx="16" fill="#1DBFB3"/>
  <!-- White medical cross -->
  <rect x="24" y="12" width="24" height="48" rx="3" fill="#FFFFFF"/>
  <rect x="12" y="24" width="48" height="24" rx="3" fill="#FFFFFF"/>
  <!-- ECG pulse -->
  <polyline
    points="5,36 16,36 22,36 26,30 29,44 34,24 39,42 42,34 46,36 56,36 68,36"
    fill="none"
    stroke="#1DBFB3"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- REVOLTRIC wordmark -->
  <text x="88" y="40" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="1">REVOLTRIC</text>
  <!-- HEALTHCARE SOLUTIONS subtitle -->
  <text x="88" y="60" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#1DBFB3" letter-spacing="4">HEALTHCARE SOLUTIONS</text>
</svg>
