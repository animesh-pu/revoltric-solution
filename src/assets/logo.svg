<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="REVOLTRIC logo">
  <!-- Teal rounded square background -->
  <rect width="120" height="120" rx="26" fill="#1DBFB3"/>
  <!-- White medical cross -->
  <rect x="42" y="20" width="36" height="80" rx="4" fill="#FFFFFF"/>
  <rect x="20" y="42" width="80" height="36" rx="4" fill="#FFFFFF"/>
  <!-- ECG heartbeat pulse line running horizontally through center -->
  <polyline
    points="14,60 30,60 36,60 40,52 44,70 50,42 56,68 60,56 64,60 80,60 106,60"
    fill="none"
    stroke="#1DBFB3"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
