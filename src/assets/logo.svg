<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="REVOLTRIC logo">
  <defs>
    <!-- Dark left gradient (navy to teal) -->
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <!-- Light right gradient (teal to light cyan) -->
    <linearGradient id="grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#5CE0D8"/>
    </linearGradient>
    <!-- Medium center gradient -->
    <linearGradient id="grad-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4D64"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <!-- Shadow for depth -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#0B1D3A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background ribbon arm: Top-Left flowing curve (dark navy-teal) -->
  <path
    d="M 38 22 C 22 28, 18 46, 26 60 C 32 70, 50 68, 60 58 C 52 52, 36 50, 30 38 C 26 30, 30 24, 38 22 Z"
    fill="url(#grad-dark)"
    filter="url(#shadow)"
  />

  <!-- Background ribbon arm: Bottom-Left flowing curve (dark navy) -->
  <path
    d="M 26 60 C 18 74, 22 94, 38 98 C 50 100, 62 90, 68 78 C 58 82, 42 84, 34 76 C 28 70, 28 64, 26 60 Z"
    fill="#0D2847"
    filter="url(#shadow)"
  />

  <!-- Foreground ribbon arm: Top-Right flowing curve (light teal-cyan) -->
  <path
    d="M 82 22 C 98 28, 102 46, 94 60 C 88 70, 70 68, 60 58 C 68 52, 84 50, 90 38 C 94 30, 90 24, 82 22 Z"
    fill="url(#grad-light)"
    filter="url(#shadow)"
  />

  <!-- Foreground ribbon arm: Bottom-Right flowing curve (medium teal) -->
  <path
    d="M 94 60 C 102 74, 98 94, 82 98 C 70 100, 58 90, 52 78 C 62 82, 78 84, 86 76 C 92 70, 92 64, 94 60 Z"
    fill="url(#grad-mid)"
    filter="url(#shadow)"
  />

  <!-- Central accent: flowing inner ribbon (bright teal highlight) -->
  <path
    d="M 54 34 C 46 40, 42 52, 48 60 C 54 68, 66 68, 72 60 C 78 52, 74 40, 66 34 C 62 30, 58 30, 54 34 Z"
    fill="#22D3EE"
    opacity="0.85"
  />

  <!-- Small highlight accent on center crossing -->
  <ellipse cx="60" cy="60" rx="6" ry="6" fill="#67E8F9" opacity="0.6"/>
</svg>
