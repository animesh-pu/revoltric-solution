<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Revoltric Solutions logo">
  <defs>
    <clipPath id="cross">
      <rect x="40" y="15" width="40" height="90" rx="10"/>
      <rect x="15" y="40" width="90" height="40" rx="10"/>
    </clipPath>
  </defs>
  <!-- Cross with diagonal colour split: navy (lower-left) / teal (upper-right) -->
  <g clip-path="url(#cross)">
    <polygon points="0,0 120,0 120,120" fill="#0FA3A0"/>
    <polygon points="0,0 0,120 120,120" fill="#0B1F4B"/>
  </g>
  <!-- White ECG heartbeat running vertically through the centre of the cross -->
  <path
    d="M60,18 L60,28 L56,30 L58,33 L60,34 L56,36 L50,25 L56,40 L60,42 L60,100"
    stroke="#FFFFFF"
    stroke-width="3.5"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
